name: CI

# The full CI/CD build pipeline for this project:
#   build-test — lint (enforced), compile-check, and the rollout/rollback/self-heal tests
#   docker     — build the deployable container image (multi-stage) and push it to GHCR
# The "CD + self-healing" half is the deployment controller in app/ (see README).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deploydb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint (enforced)
        run: ruff check app scripts

      - name: Compile check
        run: python -m compileall -q app scripts

      - name: Create database + schema
        run: python scripts/migrate.py

      - name: Test (rollout, rollback, self-healing state machine)
        run: python -m pytest -q

  docker:
    # Build the container image only after code + tests pass.
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # to push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Log in to GHCR only on pushes to main (PRs from forks can't access secrets).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build only (validates the Dockerfile); pushes to main also publish.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
